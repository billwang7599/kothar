# Builds Kothar on a Mac, signs and notarizes it, and publishes a GitHub Release with the DMG (CONTRIBUTING.md,
# "Releasing"). A pushed v* tag releases; running it by hand (Actions → Release → Run workflow) is a dry run that builds,
# signs, notarizes and verifies, keeps the DMG as a workflow artifact for a week, and publishes nothing.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # scripts/signing.ts stops the build rather than ship anything less than signed and notarized.
      KOTHAR_REQUIRE_NOTARIZED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag has to match the version in packages/desktop/package.json, which names the DMG and the app's version.
      # Bump the version in a commit first; the workflow never changes it.
      - name: Check the tag matches the version
        id: version
        run: |
          version=$(node -p "require('./packages/desktop/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but packages/desktop/package.json says $version. Bump the version to ${GITHUB_REF_NAME#v} in a commit, then tag that commit."
            exit 1
          fi
          echo "Building Kothar $version"

      # Only names are printed, never values.
      - name: Check the signing secrets
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing() { for name in "$@"; do [ -n "${!name}" ] || printf '%s ' "$name"; done; }
          failed=0
          cert=$(missing MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD)
          if [ -n "$cert" ]; then
            echo "::error::Missing repository secrets for the signing certificate: $cert"
            failed=1
          fi
          api=$(missing APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER)
          id=$(missing APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID)
          if [ -z "$api" ]; then
            echo "Notarizing with the App Store Connect API key"
          elif [ "$api" != "APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER " ]; then
            echo "::error::The App Store Connect API key secrets are only partly set. Missing: $api"
            failed=1
          elif [ -z "$id" ]; then
            echo "Notarizing with the Apple ID and app-specific password"
          else
            echo "::error::No notarization secrets. Add APPLE_API_KEY_P8, APPLE_API_KEY_ID and APPLE_API_ISSUER (or, instead, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID). Missing: $api$id"
            failed=1
          fi
          exit "$failed"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      # A keychain of the job's own, deleted at the end, with the certificate and Apple's Developer ID intermediate in it.
      - name: Import the signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/kothar-signing.keychain-db"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -f pkcs12 -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          names=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"Developer ID Application: \(.*\)"$/\1/p' | sort -u)
          count=$(printf '%s' "$names" | grep -c . || true)
          if [ "$count" != 1 ]; then
            echo "::error::MACOS_CERTIFICATE_P12 should hold exactly one valid Developer ID Application certificate with its private key; it holds $count."
            exit 1
          fi
          echo "Signing as Developer ID Application: $names"
          {
            echo "CSC_NAME=$names"
            echo "CSC_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"

      - name: Write the App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then echo "No API key; using the Apple ID."; exit 0; fi
          mkdir -p "$RUNNER_TEMP/private_keys"
          key="$RUNNER_TEMP/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"

      # scripts/signing.ts signs every binary, notarizes and staples the app, then signs, notarizes and staples the DMG.
      - name: Build, sign and notarize
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run package -- --publish never

      - name: Verify the app and the DMG
        working-directory: packages/desktop/release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dmg="Kothar-$VERSION-arm64.dmg"
          app=mac-arm64/Kothar.app
          check() {
            out=$("$@" 2>&1) || { echo "$out"; echo "::error::Gatekeeper rejected: $*"; exit 1; }
            echo "$out"
            echo "$out" | grep -q 'source=Notarized Developer ID' || { echo "::error::Not notarized: $*"; exit 1; }
          }
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
          check spctl -a -vvv "$app"
          check spctl -a -vvv -t open --context context:primary-signature "$dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"
          cat "$dmg.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kothar-dmg
          path: |
            packages/desktop/release/Kothar-${{ steps.version.outputs.version }}-arm64.dmg
            packages/desktop/release/Kothar-${{ steps.version.outputs.version }}-arm64.dmg.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Delete the keychain and key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/kothar-signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/DeveloperIDG2CA.cer"

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kothar-dmg
          path: dist
      # A tag with a hyphen (v0.2.0-beta.1) makes a pre-release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=()
          case "$TAG" in *-*) pre=(--prerelease) ;; esac
          gh release create "$TAG" dist/* --verify-tag --generate-notes --title "Kothar ${TAG#v}" "${pre[@]}"
